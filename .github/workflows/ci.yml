name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: npm run build

  privileged-acceptance-note:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Privileged Bubblewrap/cgroup acceptance is intentionally not run on GitHub-hosted CI."
          echo "Run npm run test:privileged on a disposable supported root-managed host."
