<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="relay-title relay-desc">
  <title id="relay-title">没有 ShellBridge 时 — 人肉复制粘贴中转循环</title>
  <desc id="relay-desc">一个循环：ChatGPT 给出一条命令，你复制到 SSH 终端，你再复制输出结果，把结果发回 ChatGPT，ChatGPT 再给出下一条命令，不断重复。</desc>

  <rect width="1200" height="320" rx="24" fill="#FBFAF6"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#E5E1D8" stroke-width="1.5"/>

  <g id="relay-loop" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- step 1 -->
    <rect x="80" y="40" width="320" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="100" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">01</text>
    <text x="240" y="98" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">ChatGPT 给出一条命令</text>

    <!-- step 2 -->
    <rect x="440" y="40" width="320" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="460" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">02</text>
    <text x="600" y="98" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">你复制到 SSH 终端</text>

    <!-- step 3 -->
    <rect x="800" y="40" width="320" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="820" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">03</text>
    <text x="960" y="98" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">你再复制输出结果</text>

    <!-- step 4 -->
    <rect x="800" y="184" width="320" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="820" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">04</text>
    <text x="960" y="242" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">把结果发回 ChatGPT</text>

    <!-- step 5 -->
    <rect x="440" y="184" width="320" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="460" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">05</text>
    <text x="600" y="234" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">ChatGPT 再给出</text>
    <text x="600" y="260" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">下一条命令</text>

    <!-- step 6 -->
    <rect x="80" y="184" width="320" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="100" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">06</text>
    <text x="240" y="246" font-size="20" font-weight="700" fill="#B42318" text-anchor="middle">不断重复</text>

    <!-- arrows -->
    <g stroke="#98A1AC" stroke-width="2.5" fill="#98A1AC">
      <line x1="408" y1="88" x2="432" y2="88"/>
      <path d="M426 81 L438 88 L426 95 Z" stroke="none"/>
      <line x1="768" y1="88" x2="792" y2="88"/>
      <path d="M786 81 L798 88 L786 95 Z" stroke="none"/>
      <line x1="960" y1="144" x2="960" y2="176"/>
      <path d="M953 170 L960 182 L967 170 Z" stroke="none"/>
      <line x1="792" y1="232" x2="768" y2="232"/>
      <path d="M774 225 L762 232 L774 239 Z" stroke="none"/>
      <line x1="432" y1="232" x2="408" y2="232"/>
      <path d="M414 225 L402 232 L414 239 Z" stroke="none"/>
      <line x1="240" y1="176" x2="240" y2="144"/>
      <path d="M233 150 L240 138 L247 150 Z" stroke="none"/>
    </g>
  </g>
</svg>
