<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="relay-title relay-desc">
  <title id="relay-title">Without ShellBridge — the manual copy-and-paste relay</title>
  <desc id="relay-desc">A loop: ChatGPT gives you a command, you copy it into SSH, you copy the output back, ChatGPT asks for another command, and the cycle repeats.</desc>

  <rect width="1200" height="320" rx="24" fill="#FBFAF6"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#E5E1D8" stroke-width="1.5"/>

  <g id="relay-loop" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- step 1 -->
    <rect x="130" y="40" width="340" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="150" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">01</text>
    <text x="300" y="98" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">ChatGPT gives you a command</text>

    <!-- step 2 -->
    <rect x="730" y="40" width="340" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="750" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">02</text>
    <text x="900" y="98" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">You copy it into SSH</text>

    <!-- step 3 -->
    <rect x="730" y="184" width="340" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="750" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">03</text>
    <text x="900" y="242" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">You copy the output back</text>

    <!-- step 4 -->
    <rect x="130" y="184" width="340" height="96" rx="16" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
    <text x="150" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#98A1AC">04</text>
    <text x="300" y="234" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">ChatGPT asks for</text>
    <text x="300" y="260" font-size="20" font-weight="500" fill="#1C222B" text-anchor="middle">another command</text>

    <!-- arrows -->
    <g stroke="#98A1AC" stroke-width="2.5" fill="#98A1AC">
      <line x1="478" y1="88" x2="722" y2="88"/>
      <path d="M716 81 L728 88 L716 95 Z" stroke="none"/>
      <line x1="900" y1="144" x2="900" y2="176"/>
      <path d="M893 170 L900 182 L907 170 Z" stroke="none"/>
      <line x1="722" y1="232" x2="478" y2="232"/>
      <path d="M484 225 L472 232 L484 239 Z" stroke="none"/>
      <line x1="300" y1="176" x2="300" y2="144"/>
      <path d="M293 150 L300 138 L307 150 Z" stroke="none"/>
    </g>
    <text x="318" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#B42318">Repeat</text>
  </g>
</svg>
